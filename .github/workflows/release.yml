name: Release

# Manual only
# ("Run workflow") to create a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Leave blank to tag v<version> from tauri.conf.json. Set this only to override it."
        required: false
        type: string
      draft:
        description: "Create the release as a draft (recommended until you have opened the installers)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # Both platforms build first and hand their installers over as workflow
  # artifacts. A single publish job then attaches them to one release.
  #
  # That split is deliberate: if each build job created the release itself, the
  # two would race to create the same tag, and whichever lost would fail. It also
  # means neither platform can publish a release that is missing the other.
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    # Signs the updater archive. The key is a repo secret, and the repo config
    # leaves createUpdaterArtifacts off so local builds need no key.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # pnpm 11 needs Node >= 22.13 (it uses the node:sqlite builtin). The pnpm
      # version is pinned to the one that generated pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `tauri` script routes `build` to scripts/build-macos.sh on macOS,
      # which runs `tauri build --bundles app`, ad-hoc signs it, and assembles
      # the DMG. `beforeBuildCommand` runs the Next export either way.
      #
      # --config turns on the updater archive (.app.tar.gz plus its .sig) for CI
      # only, so a local build needs no signing key.
      - name: Build the app, the DMG and the updater archive
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Show what was produced
        run: find src-tauri/target/release/bundle -maxdepth 3 -print

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On Windows the `tauri` script is a plain `tauri build`, so this produces
      # the MSI and NSIS installers under bundle/msi and bundle/nsis. Tauri
      # fetches WiX and NSIS itself; neither needs installing here.
      #
      # The NSIS .zip plus its .sig is what the updater installs from, so both
      # are built and signed alongside the installer the user downloads first.
      - name: Build the installers and the updater archive
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Show what was produced
        run: Get-ChildItem -Recurse -Path src-tauri/target/release/bundle | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be attached
        run: find artifacts -type f -printf '%p  (%s bytes)\n'

      - name: Resolve the release tag
        id: release
        run: |
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # The published app polls latest.json from releases/latest, so it has to
      # exist as an asset before the release goes live. It asserts that both
      # platforms are present and signed rather than publishing a manifest that
      # would strand one of them.
      - name: Build the updater manifest
        run: |
          node scripts/updater-manifest.mjs \
            artifacts \
            "${{ steps.release.outputs.tag }}" \
            "${{ github.repository }}" \
            "${{ steps.release.outputs.version }}" \
            latest.json
          cat latest.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pulse ${{ steps.release.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          # `**` because upload-artifact stores files relative to the least common
          # ancestor of the paths it was handed. The single macOS pattern keeps
          # that flat; the two Windows patterns share `bundle/`, so its installers
          # arrive nested under msi/ and nsis/.
          #
          # Failing on an unmatched pattern is deliberate: a release that quietly
          # ships one platform is worse than a red run.
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.nsis.zip
            latest.json
          body: |
            ## Pulse ${{ steps.release.outputs.tag }}

            macOS (Apple silicon) and Windows installers for the same build.

            Both are signed locally rather than with a paid certificate, so each OS
            warns on first run.

            **macOS** - right-click the app and choose **Open**, or clear the flag:

            ```
            xattr -dr com.apple.quarantine /Applications/Pulse.app
            ```

            **Windows** - SmartScreen will say "Windows protected your PC". Choose
            **More info** → **Run anyway**.

            Pulse needs **Node.js 22.13 or newer** for the extraction engine. It
            offers to install the rest on first launch.
