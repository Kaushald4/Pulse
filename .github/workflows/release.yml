name: Release

# Manual only
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Leave blank to tag v<version> from tauri.conf.json. Set this only to override it."
        required: false
        type: string
      draft:
        description: "Create the release as a draft (recommended until you have opened the installers)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # One publish job rather than one per platform: two would race for the same tag,
  # and either could publish a release missing the other platform.
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # pnpm 11 needs Node >= 22.13; the pnpm version matches pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # updater.conf.json enables the updater archive and its .sig for CI only, so
      # a local build needs no key. It is a file because PowerShell strips the
      # quotes out of inline JSON.
      - name: Build the app, the DMG and the updater archive
        run: pnpm tauri build --config src-tauri/updater.conf.json

      - name: Show what was produced
        run: find src-tauri/target/release/bundle -maxdepth 3 -print

      # The .app.tar.gz and its .sig are what the updater installs from.
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The NSIS `-setup.exe` and its .sig are the Windows updater artifact, run
      # directly by the plugin. Tauri fetches WiX and NSIS itself.
      - name: Build the installers and the updater archive
        run: pnpm tauri build --config src-tauri/updater.conf.json

      - name: Show what was produced
        run: Get-ChildItem -Recurse -Path src-tauri/target/release/bundle | Select-Object FullName

      # The .sig files are read by the manifest step, so they must be uploaded too.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show what will be attached
        run: find artifacts -type f -printf '%p  (%s bytes)\n'

      - name: Resolve the release tag
        id: release
        run: |
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # The installed app polls latest.json from releases/latest, so it has to be
      # an asset. The script fails if a platform is missing or unsigned.
      - name: Build the updater manifest
        run: |
          node scripts/updater-manifest.mjs \
            artifacts \
            "${{ steps.release.outputs.tag }}" \
            "${{ github.repository }}" \
            "${{ steps.release.outputs.version }}" \
            latest.json
          cat latest.json

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pulse ${{ steps.release.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          # A release that quietly ships one platform is worse than a red run.
          fail_on_unmatched_files: true
          # `**` because upload-artifact nests the Windows files under msi/ and
          # nsis/. The updater archives and their .sig files are required too.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.sig
            latest.json
          body: |
            ## Pulse ${{ steps.release.outputs.tag }}

            macOS (Apple silicon) and Windows installers for the same build.

            Both are signed locally rather than with a paid certificate, so each OS
            warns on first run.

            **macOS** - right-click the app and choose **Open**, or clear the flag:

            ```
            xattr -dr com.apple.quarantine /Applications/Pulse.app
            ```

            **Windows** - SmartScreen will say "Windows protected your PC". Choose
            **More info** → **Run anyway**.

            Pulse needs **Node.js 22.13 or newer** for the extraction engine. It
            offers to install the rest on first launch.
