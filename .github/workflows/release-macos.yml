name: Release (macOS)

# Manual only. Nothing here runs on push: trigger it from the Actions tab
# ("Run workflow") to create release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0. Leave blank to use the version in tauri.conf.json."
        required: false
        type: string
      draft:
        description: "Create the release as a draft (recommended until you have checked the DMG)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  macos:
    name: Build the macOS app and publish it
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `tauri` script routes `build` to scripts/build-macos.sh on macOS,
      # which runs `tauri build --bundles app`, ad-hoc signs it, and assembles
      # the DMG. `beforeBuildCommand` runs the Next export, so the frontend is
      # built as part of this.
      - name: Build the app and the DMG
        run: pnpm tauri build

      - name: Show what was produced
        run: find src-tauri/target/release/bundle -maxdepth 3 -print

      - name: Resolve the release tag
        id: release
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Pulse ${{ steps.release.outputs.tag }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            ## Pulse for macOS

            Apple silicon build. Pulse is signed ad-hoc rather than notarised, so
            macOS will warn the first time you open it. Either right-click the app
            and choose **Open**, or clear the quarantine flag:

            ```
            xattr -dr com.apple.quarantine /Applications/Pulse.app
            ```

            Pulse needs **Node.js 20 or newer** for the extraction engine. It will
            offer to install the rest on first launch.
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
